<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - Almacén</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800">
    <nav class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="font-bold text-base text-gray-800">Almacén</span>
            </div>

            <div class="flex items-center gap-4">
                <a href="/inventario"
                    class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold transition border border-gray-300">
                    Inventario
                </a>
                <div class="h-5 w-px bg-gray-300"></div>
                <span data-th-text="${usuario.nombre}" class="text-xs font-semibold text-gray-600"></span>
                <a href="/logout"
                    class="px-3.5 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white text-xs font-bold transition shadow-sm">Cerrar
                    Sesión</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8 space-y-6">
        <section
            class="p-5 rounded-xl bg-white border border-gray-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h2 class="text-base font-bold text-gray-800">Historial de Movimientos</h2>
            </div>

            <div class="inline-flex p-1 rounded-lg bg-gray-100 border border-gray-300 gap-1">
                <a href="/historico?filtro=TODOS"
                    data-th-class="${filtroActual == 'TODOS'} ? 'px-3 py-1.5 rounded bg-red-600 text-white text-xs font-bold shadow transition' : 'px-3 py-1.5 rounded text-gray-600 hover:text-gray-900 text-xs font-bold transition'">
                    Todos
                </a>
                <a href="/historico?filtro=ENTRADA"
                    data-th-class="${filtroActual == 'ENTRADA'} ? 'px-3 py-1.5 rounded bg-green-600 text-white text-xs font-bold shadow transition' : 'px-3 py-1.5 rounded text-gray-600 hover:text-green-700 text-xs font-bold transition'">
                    Entradas
                </a>
                <a href="/historico?filtro=SALIDA"
                    data-th-class="${filtroActual == 'SALIDA'} ? 'px-3 py-1.5 rounded bg-amber-600 text-white text-xs font-bold shadow transition' : 'px-3 py-1.5 rounded text-gray-600 hover:text-amber-700 text-xs font-bold transition'">
                    Salidas
                </a>
            </div>
        </section>

        <section class="rounded-xl bg-white border border-gray-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr
                            class="border-b border-gray-200 text-gray-500 text-xs font-bold uppercase tracking-wider bg-gray-100/60">
                            <th class="py-3 px-6 w-24">Folio</th>
                            <th class="py-3 px-6 w-32 text-center">Producto</th>
                            <th class="py-3 px-6 w-36 text-center">Realizado por</th>
                            <th class="py-3 px-6 text-center">Tipo de Movimiento</th>
                            <th class="py-3 px-6 text-center">Cantidad</th>
                            <th class="py-3 px-6 text-right">Fecha y Hora de Registro</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 text-sm">
                        <tr data-th-each="mov : ${movimientos}" class="hover:bg-gray-50/80 transition">
                            <td class="py-3.5 px-6 font-bold text-gray-500 text-xs" data-th-text="${mov.idMovimiento}">
                            </td>
                            <td class="py-3.5 px-6 text-center font-bold text-gray-800 text-xs">
                                <div data-th-text="${mov.nombreProducto}"></div>
                            </td>
                            <td class="py-3.5 px-6 text-center font-bold text-gray-600 text-xs">
                                <div data-th-text="${mov.nombreUsuario}"></div>
                            </td>
                            <td class="py-3.5 px-6 text-center">
                                <span data-th-text="${mov.tipoMovimiento}"
                                    data-th-class="${mov.tipoMovimiento == 'ENTRADA'} ? 'px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-800' : 'px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800'">
                                </span>
                            </td>
                            <td class="py-3.5 px-6 text-center font-bold text-gray-800" data-th-text="${mov.cantidad}">
                            </td>
                            <td class="py-3.5 px-6 text-right text-xs text-gray-500 font-medium"
                                data-th-text="${#temporals.format(mov.fechaHora, 'dd/MM/yyyy - HH:mm:ss')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>

</html>
