<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Almacén</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800 relative">
    <nav class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="font-bold text-base text-gray-800">Almacén</span>
            </div>

            <div class="flex items-center gap-4">
                <a data-th-if="${usuario.idRol == 1}" href="/historico"
                    class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold transition border border-gray-300">
                    Historial de Movimientos
                </a>
                <a data-th-if="${usuario.idRol == 2 and !esModuloSalida}" href="/salida"
                    class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold transition border border-gray-300">
                    Salida de Productos
                </a>
                <a data-th-if="${usuario.idRol == 2 and esModuloSalida}" href="/inventario"
                    class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold transition border border-gray-300">
                    Catálogo de Productos
                </a>
                <div class="h-5 w-px bg-gray-300"></div>
                <span data-th-text="${usuario.nombre}" class="text-xs font-semibold text-gray-600"></span>
                <a href="/logout"
                    class="px-3.5 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white text-xs font-bold transition shadow-sm">Cerrar
                    Sesión</a>
            </div>
        </div>
    </nav>

    <div data-th-if="${errorMensaje}" id="alertaToast"
        class="fixed top-20 right-6 z-50 max-w-md bg-white border-l-4 border-red-600 p-4 shadow-2xl rounded-r-lg flex items-start gap-3 transition-opacity duration-500">
        <div class="flex-1">
            <span class="block font-bold text-red-600 text-xs uppercase tracking-wider">Alerta</span>
            <p data-th-text="${errorMensaje}" class="text-sm font-semibold text-gray-700 mt-0.5"></p>
        </div>
        <button onclick="document.getElementById('alertaToast').remove()"
            class="text-gray-400 hover:text-gray-700 font-bold text-xl leading-none">&times;</button>
    </div>

    <main class="max-w-7xl mx-auto px-6 py-8 space-y-6">
        <section data-th-if="${usuario.idRol == 1}" class="p-5 rounded-xl bg-white border border-gray-200 shadow-sm">
            <form action="/producto/agregar" method="post"
                class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <span class="text-sm font-bold text-gray-700"> Agregar Nuevo Producto</span>
                <div class="flex w-full sm:w-auto gap-3">
                    <input type="text" name="nombre" placeholder="Nombre del producto..." required
                        class="flex-1 sm:w-80 px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg text-xs text-gray-800 focus:outline-none focus:bg-white focus:border-red-600 focus:ring-1 focus:ring-red-600 transition">
                    <button type="submit" title="Se registrará con 0 existencias y estatus activo."
                        class="px-5 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white text-xs font-bold whitespace-nowrap transition shadow-sm cursor-help">
                        Registrar
                    </button>
                </div>
            </form>
        </section>

        <section class="rounded-xl bg-white border border-gray-200 shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                <span class="font-bold text-gray-700 text-sm" data-th-text="${tituloModulo}"></span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr
                            class="border-b border-gray-200 text-gray-500 text-xs font-bold uppercase tracking-wider bg-gray-100/60">
                            <th class="py-3 px-6 w-24">Folio</th>
                            <th class="py-3 px-6">Nombre del Producto</th>
                            <th class="py-3 px-6 w-36 text-center">Existencias</th>
                            <th data-th-if="${usuario.idRol == 1}" class="py-3 px-6 w-32 text-center">Estatus</th>
                            <th data-th-if="${mostrarAcciones}" class="py-3 px-6 w-72 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 text-sm">
                        <tr data-th-each="prod : ${productos}" class="hover:bg-gray-50/80 transition">
                            <td class="py-3.5 px-6 font-bold text-gray-500 text-xs" data-th-text="${prod.idProducto}">
                            </td>
                            <td class="py-3.5 px-6 font-bold text-gray-800" data-th-text="${prod.nombre}"></td>
                            <td class="py-3.5 px-6 text-center">
                                <span data-th-text="${prod.cantidad}"
                                    data-th-class="${prod.cantidad > 0} ? 'px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-800' : 'px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-800'">
                                </span>
                            </td>
                            <td data-th-if="${usuario.idRol == 1}" class="py-3.5 px-6 text-center">
                                <span data-th-text="${prod.estatus == 1} ? 'Activo' : 'Inactivo'"
                                    data-th-class="${prod.estatus == 1} ? 'px-2.5 py-0.5 rounded text-xs font-bold bg-green-100 text-green-800 border border-green-300' : 'px-2.5 py-0.5 rounded text-xs font-bold bg-gray-200 text-gray-600 border border-gray-300'">
                                </span>
                            </td>
                            <td data-th-if="${mostrarAcciones}" class="py-3.5 px-6">
                                <div class="flex items-center justify-center gap-2">
                                    <form data-th-if="${usuario.idRol == 1 and !esModuloSalida and prod.estatus == 1}"
                                        action="/producto/entrada" method="post" class="inline-flex items-center gap-1">
                                        <input type="hidden" name="idProducto" data-th-value="${prod.idProducto}">
                                        <input type="number" name="cantidad" step="1" required placeholder="Cant."
                                            class="w-16 px-2 py-1 bg-white border border-gray-300 rounded text-xs text-center font-bold text-gray-800 focus:outline-none focus:border-red-600">
                                        <button type="submit"
                                            class="px-3 py-1 bg-green-600 hover:bg-green-700 text-white font-bold text-xs rounded transition whitespace-nowrap shadow-sm">
                                            Entrada
                                        </button>
                                    </form>

                                    <form data-th-if="${esModuloSalida}" action="/producto/salida" method="post"
                                        class="inline-flex items-center gap-1">
                                        <input type="hidden" name="idProducto" data-th-value="${prod.idProducto}">
                                        <input type="number" name="cantidad" step="1" required placeholder="Cant."
                                            class="w-16 px-2 py-1 bg-white border border-gray-300 rounded text-xs text-center font-bold text-gray-800 focus:outline-none focus:border-red-600">
                                        <button type="submit"
                                            class="px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded transition whitespace-nowrap shadow-sm">
                                            Salida
                                        </button>
                                    </form>

                                    <form data-th-if="${usuario.idRol == 1 and !esModuloSalida}" action="/producto/estatus" method="post">
                                        <input type="hidden" name="idProducto" data-th-value="${prod.idProducto}">
                                        <input type="hidden" name="estatus"
                                            data-th-value="${prod.estatus == 1 ? 0 : 1}">
                                        <button type="submit"
                                            data-th-text="${prod.estatus == 1 ? 'Dar de Baja' : 'Reactivar'}"
                                            data-th-class="${prod.estatus == 1 ? 'px-3 py-1 rounded bg-gray-200 hover:bg-red-600 text-gray-700 hover:text-white text-xs font-bold transition border border-gray-300 whitespace-nowrap' : 'px-3 py-1 rounded bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold transition shadow-sm whitespace-nowrap'}">
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        setTimeout(() => {
            const toast = document.getElementById('alertaToast');
            if (toast) {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 500);
            }
        }, 5000);
    </script>
</body>

</html>
