<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Almacén</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white border border-gray-200 rounded-xl shadow-lg p-8">
        <div class="mb-6 text-center border-b border-gray-100 pb-4">
            <h1 class="text-2xl font-bold text-gray-800">Almacén</h1>
            <p class="text-gray-500 text-sm mt-1">Acceso al sistema</p>
        </div>

        <div data-th-if="${error}" class="mb-6 p-4 rounded-lg bg-red-50 border border-red-200 flex items-center gap-3">
            <span class="text-red-600 text-sm font-semibold" data-th-text="${error}"></span>
        </div>

        <form action="/login" method="post" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-xs font-bold uppercase mb-2">Correo corporativo</label>
                <input type="email" name="correo" required placeholder="usuario@empresa.com"
                    class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-gray-800 text-sm focus:outline-none focus:bg-white focus:border-red-600 focus:ring-1 focus:ring-red-600 transition">
            </div>
            <div>
                <label class="block text-gray-700 text-xs font-bold uppercase mb-2">Contraseña</label>
                <input type="password" name="contrasena" required placeholder="••••••••"
                    class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-gray-800 text-sm focus:outline-none focus:bg-white focus:border-red-600 focus:ring-1 focus:ring-red-600 transition">
            </div>
            <button type="submit"
                class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg text-sm transition duration-200 shadow-md">
                Iniciar Sesión
            </button>
        </form>
    </div>
</body>

</html>
